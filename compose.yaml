name: forgecloud
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgecloud}
      POSTGRES_USER: ${POSTGRES_USER:-forgecloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forgecloud_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-forgecloud}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-forgecloud}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FORGECLOUD_GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET in .env}
      FORGECLOUD_WORKER_ENABLED: ${FORGECLOUD_WORKER_ENABLED:-false}
      FORGECLOUD_WORKER_POLL_INTERVAL_MS: ${FORGECLOUD_WORKER_POLL_INTERVAL_MS:-5000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8080
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  forgecloud_postgres:
